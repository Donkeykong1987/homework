<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lista notatek</title>
</head>
<body>
    <h1>Lista notatek</h1>
    <ul>
        {% for note in notes %}
            <li>
                <a href="{% url 'note_detail' note.id %}">{{ note.title }}</a>
            </li>
        {% empty %}
            <li>Brak notatek.</li>
        {% endfor %}
    </ul>
</body>
</html>
